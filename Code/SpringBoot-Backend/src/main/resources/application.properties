spring.application.name=billing
server.port=8080

# In-memory H2 database - no external DB setup needed for the demo.
spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Handy for peeking at seeded data during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
